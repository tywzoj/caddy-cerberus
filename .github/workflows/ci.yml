name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    outputs:
      caddy-version:
        description: Validated Caddy version
        value: ${{ jobs.build.outputs.caddy-version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      caddy-version: ${{ steps.verify.outputs.caddy-version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure optional Cachix cache
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true

      - name: Check flake and package invariants
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build default package
        run: nix build --no-update-lock-file --print-build-logs

      - name: Verify Caddy version and Cerberus modules
        id: verify
        run: |
          expected="$(nix eval --raw .#packages.x86_64-linux.caddy-cerberus.version)"
          version="$(./result/bin/caddy version)"
          echo "$version"
          case "$version" in
            "v$expected"|"v$expected "*) ;;
            *) echo "::error::Expected Caddy v$expected, got: $version"; exit 1 ;;
          esac
          ./result/bin/caddy list-modules | grep -i cerberus
          echo "caddy-version=$expected" >> "$GITHUB_OUTPUT"

      - name: Publish validated package to optional Cachix cache
        if: github.event_name != 'pull_request' && vars.CACHIX_CACHE != ''
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -n "$CACHIX_AUTH_TOKEN" ]]; then
            cachix push "$CACHIX_CACHE" "$(readlink -f result)"
          else
            echo "::notice::No CACHIX_AUTH_TOKEN configured; skipping cache publication."
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Caddy/Cerberus build or validation failed. See the failing step and Nix build logs above."
